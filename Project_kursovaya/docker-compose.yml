services:
  travelcrm-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: travelcrm:latest
    container_name: travelcrm-web
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/travelcrm.db
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  sqlite_data:
    name: travelcrm_sqlite_data
